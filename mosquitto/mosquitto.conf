# ============================================================
# Eclipse Mosquitto 2.x Configuration
# Solar Tracker — local MQTT broker
# ============================================================

# Listen on all interfaces on port 1883.
# Change to 127.0.0.1 to restrict to localhost only.
listener 1883

# Require authentication — no anonymous connections.
allow_anonymous false

# Password file path.  May vary by distro; adjust if needed.
# Create with: sudo mosquitto_passwd -c /etc/mosquitto/passwd solartracker
password_file /etc/mosquitto/passwd

# Topic-level access control list.
acl_file /etc/mosquitto/acl

# Persist retained messages and QoS 1/2 queues across restarts.
persistence true
persistence_location /var/lib/mosquitto/

# Logging
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
